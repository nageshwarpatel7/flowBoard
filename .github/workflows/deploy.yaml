name: Deploy FlowBoard to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:

  # ── JOB 1: Run backend tests ─────────────────────────────────────────────
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests for all services
        run: |
          SERVICES=(
            auth-service
            workspace-service
            board-service
            list-service
            card-service
            notification-service
            payment-service
          )
          for SVC in "${SERVICES[@]}"; do
            echo "========================================="
            echo "Testing: $SVC"
            echo "========================================="
            cd $SVC
            mvn test -q --no-transfer-progress
            cd ..
          done

  # ── JOB 2: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test           # only deploy if all tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Write the .env file content to a temp file using GitHub Secrets
      - name: Create .env file for server
        run: |
          cat > deployment.env << 'ENVEOF'
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GMAIL_USERNAME=${{ secrets.GMAIL_USERNAME }}
          GMAIL_PASSWORD=${{ secrets.GMAIL_PASSWORD }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MYSQL_ROOT_PASSWORD=${{ secrets.DB_PASSWORD }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPRING_RABBITMQ_USERNAME=flowboard
          SPRING_RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          ENVEOF

      # Set up SSH agent with EC2 private key
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Add EC2 host to known_hosts to avoid interactive fingerprint prompt
      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Copy the .env file to the server
      - name: Upload .env to server
        run: |
          scp deployment.env ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/flowBoard/.env

      # SSH into EC2 and run the deployment
      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'SSHEOF'
            set -e

            echo ">>> Navigating to project directory"
            cd ~/flowBoard

            echo ">>> Pulling latest code from main branch"
            git pull origin main

            echo ">>> Building new Docker images and restarting services"
            docker-compose pull --ignore-pull-failures || true
            docker-compose up --build -d

            echo ">>> Waiting 30 seconds for services to start..."
            sleep 30

            echo ">>> Checking service health"
            docker-compose ps

            echo ">>> Verifying API Gateway is responding"
            curl -sf http://localhost:8080/api/v1/payments/plans > /dev/null \
              && echo "API Gateway: OK" \
              || echo "API Gateway: not responding yet (may need more time)"

            echo ">>> Cleaning up old Docker images to save disk space"
            docker image prune -f

            echo ">>> Deployment complete!"
          SSHEOF

  # ── JOB 3: Deploy Angular frontend to S3 ─────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    needs: test           # deploy frontend in parallel with backend (both need tests to pass)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flowboard-ui/package-lock.json

      - name: Install dependencies
        working-directory: flowboard-ui
        run: npm ci

      - name: Build Angular for production
        working-directory: flowboard-ui
        env:
          # These are injected via environment.prod.ts at build time
          EC2_API_URL: ${{ secrets.EC2_API_URL }}
        run: |
          ng build --configuration production
          echo "Build complete. Files:"
          ls -lh dist/flowboard-ui/browser/ | head -20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        working-directory: flowboard-ui
        run: |
          aws s3 sync dist/flowboard-ui/browser/ \
            s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"

          # index.html should never be cached — always serve latest
          aws s3 cp dist/flowboard-ui/browser/index.html \
            s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache (if using CloudFront)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "CloudFront cache invalidated"