server:
  port: 8088

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      maximum-pool-size: 3
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    # FIX: added missing dialect property (implicit in Boot 3 but explicit is safer)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect


  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:flowboard}
    password: ${SPRING_RABBITMQ_PASSWORD}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

# FIX: Stripe redirect URLs are now externalised so they can be overridden
#      per environment without rebuilding the image.
payment:
  success-url: ${PAYMENT_SUCCESS_URL:http://localhost:4200/payment/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:4200/payment/cancel}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}

  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
